# Golf Planner — host reverse proxy.
# Place at /etc/nginx/sites-available/golf-planner and symlink into sites-enabled.
# This sits IN FRONT of the Docker containers and does NOT touch your existing app.
#
# Replace `yourdomain.com` throughout with your real domain before use.
# Certbot will edit these blocks in place to add the SSL config where marked.

# --- API: api.yourdomain.com -> backend container (host port 5000) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / streaming support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Chat/RAG responses can take a while — give the backend room.
        proxy_read_timeout 120s;
    }

    # >>> Certbot will inject the SSL listen/ssl_certificate lines here. <<<
    # After `certbot --nginx`, this block gets `listen 443 ssl;` plus the cert
    # paths, and a companion port-80 -> 443 redirect block is added automatically.
}

# --- App: app.yourdomain.com -> frontend container (host port 5001) ---
server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # >>> Certbot will inject the SSL listen/ssl_certificate lines here. <<<
}
