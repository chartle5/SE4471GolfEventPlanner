# In-container nginx for the frontend image. This only serves the static SPA on
# port 80 inside the container — it is NOT the host reverse proxy (see
# README-DEPLOY.md / the host server block for that).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses history-mode URLs; fall back to index.html so deep
    # links (e.g. /tournaments/123) don't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
